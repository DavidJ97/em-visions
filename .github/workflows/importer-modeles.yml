# Tâche ponctuelle : télécharge les modèles 3D réalistes du modélisateur (modèles Sketchfab sous
# licence CC BY, copie publique Objaverse), les allège avec outils/modeles/process.mjs et les
# range dans site/models. Se relance si la liste ou le traitement changent.
name: Importer les modèles 3D
on:
  push:
    paths: ['.github/workflows/importer-modeles.yml', 'outils/modeles/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: importer-modeles
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Télécharger et préparer les modèles
        working-directory: outils/modeles
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --silent
          mkdir -p raw
          node -e "const m=require('./models.json');for(const k in m)console.log(m[k].uid,m[k].path)" | while read uid path; do
            curl -fsSL --retry 3 -o raw/$uid.glb https://huggingface.co/datasets/allenai/objaverse/resolve/main/$path
          done
          node process.mjs
          ls -la ../../site/models
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/models
          git diff --cached --quiet || git commit -m "Modèles 3D réalistes ajoutés au dépôt (23 produits)"
          git pull --rebase
          git push
