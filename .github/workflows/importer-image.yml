# Tâche ponctuelle (branche de travail) : va chercher les logos officiels des fournisseurs sur leurs sites.
name: Importer une image
on:
  push:
    branches: ['modeles-travail']
    paths: ['.github/workflows/importer-image.yml','outils/logos/chercher.py']
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 outils/logos/chercher.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add import && git commit -m "Logos des fournisseurs (candidats)" && git push
