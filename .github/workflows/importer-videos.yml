# Tâche ponctuelle : copie dans le dépôt les cinq vidéos encore hébergées chez Higgsfield,
# pour que le site ne dépende plus de ce compte. La vidéo Ricova est refermée en boucle
# (fondu de 0,8 s entre la fin et le début) pour ne plus sauter quand elle recommence.
name: Importer les vidéos dans le dépôt
on:
  push:
    paths: ['.github/workflows/importer-videos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les vidéos
        run: |
          set -euo pipefail
          B=https://d2ol7oe51mr4n9.cloudfront.net/user_3FAHB64EMrDf6yqhpJnm67SRxS5
          mkdir -p site/vid tmp
          curl -fsSL -o site/vid/buono.mp4   $B/0b74150a-99cc-4c8f-af70-7be7bcb9a7dd.mp4
          curl -fsSL -o site/vid/ma.mp4      $B/8466aef3-6aed-49ea-96ed-3e6acd8682c8.mp4
          curl -fsSL -o site/vid/caps.mp4    $B/10035e9a-9b5d-4b75-802c-41869a1b6bd1.mp4
          curl -fsSL -o site/vid/balloon.mp4 $B/1ee22cd9-9753-4d84-a4c8-8e8a685de333.mp4
          curl -fsSL -o tmp/ricova.mp4       $B/2eeabc13-7096-42b0-8273-ad22965c92fd.mp4
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          F=0.8
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 tmp/ricova.mp4)
          OFF=$(python3 -c "print(round($D-2*$F,3))")
          ffmpeg -v error -y -i tmp/ricova.mp4 -filter_complex "[0:v]split[a][b];[a]trim=start=$F,setpts=PTS-STARTPTS[m];[b]trim=end=$F,setpts=PTS-STARTPTS[h];[m][h]xfade=transition=fade:duration=$F:offset=$OFF,format=yuv420p[v]" -map "[v]" -an -c:v libx264 -crf 25 -preset slow -movflags +faststart site/vid/ricova.mp4
          ls -la site/vid
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/vid
          git diff --cached --quiet || git commit -m "Vidéos copiées dans le dépôt (Ricova, Buono, Enseigne MA, casquettes, ballon)"
          git push
