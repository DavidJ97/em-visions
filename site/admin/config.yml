         "name": "image",
         "label": "Image",
         "widget": "image",
         "choose_url": false
        },
        {
         "name": "fr",
         "label": "Description de la photo (français)",
         "widget": "string",
         "required": true,
         "hint": "Ce qu’on voit sur la photo, pour les personnes non voyantes et Google."
        },
        {
         "name": "en",
         "label": "Description de la photo (anglais)",
         "widget": "string",
         "required": false
        },
