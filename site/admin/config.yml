{
 "backend": {
  "name": "github",
  "repo": "DavidJ97/em-visions",
  "branch": "version-2",
  "squash_merges": true,
  "commit_messages": {
   "create": "Contenu : ajout de {{slug}} (admin)",
   "update": "Contenu : {{slug}} mis à jour (admin)",
   "delete": "Contenu : {{slug}} supprimé (admin)",
   "uploadMedia": "Contenu : photo {{path}} ajoutée (admin)",
   "deleteMedia": "Contenu : photo {{path}} retirée (admin)"
  }
 },
 "app_title": "EM Visions — Administration",
 "logo": {
  "src": "/img/icon-512.png"
 },
 "site_url": "https://emvisions.ca",
 "display_url": "https://emvisions.ca",
 "show_preview_links": false,
 "editor": {
  "preview": false
 },
 "media_folder": "contenu/images",
 "public_folder": "/img/contenu",
 "media_libraries": {
  "default": {
   "config": {
    "max_file_size": 30000000,
    "transformations": {
     "raster_image": {
      "format": "webp",
      "quality": 85,
      "width": 2400,
      "height": 2400
     }
    }
   }
  },
  "stock_assets": {
   "providers": []
  }
 },
 "singletons": [
  {
   "name": "coordonnees",
   "icon": "call",
   "label": "Coordonnées",
   "file": "contenu/coordonnees.json",
   "fields": [
    {
     "name": "telephone",
     "label": "Téléphone",
     "widget": "string",
     "required": false,
     "hint": "Ex. : (514) 244-9810. Laissé vide : aucun numéro sur le site."
    },
    {
     "name": "courriel",
     "label": "Courriel public",
     "widget": "string",
     "required": false,
     "pattern": [
      "^$|^[^@\\s]+@[^@\\s]+\\.[a-zA-Z]{2,}$",
      "Adresse courriel invalide"
     ],
     "hint": "Affiché dans le pied de page et la politique de confidentialité. Laissé vide : aucun courriel affiché."
    },
    {
     "name": "instagram",
     "label": "Lien Instagram",
     "widget": "string",
     "required": true,
     "pattern": [
      "^https://(www\\.)?instagram\\.com/[A-Za-z0-9._/-]+$",
      "Doit commencer par https://www.instagram.com/"
     ],
     "hint": "Adresse complète, ex. : https://www.instagram.com/visionsem/"
    }
   ]
  },
