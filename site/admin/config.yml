       "name": "telephone",
       "label": "Téléphone",
       "widget": "string",
       "required": false,
       "hint": "Ex. : (514) 244-9810. Laissé vide : aucun numéro sur le site."
      },
      {
       "name": "courriel",
       "label": "Courriel public",
       "widget": "string",
       "required": false,
       "pattern": [
        "^$|^[^@\\s]+@[^@\\s]+\\.[a-zA-Z]{2,}$",
        "Adresse courriel invalide"
       ],
       "hint": "Affiché dans le pied de page et la politique de confidentialité. Laissé vide : aucun courriel affiché."
      },
      {
       "name": "instagram",
       "label": "Lien Instagram",
       "widget": "string",
       "required": true,
       "pattern": [
        "^https://(www\\.)?instagram\\.com/[A-Za-z0-9._/-]+$",
